# Iteration 08 quick run (hard rule 7, < ~5 min): seed 0, N 20, p1 {0.05, 0.1}, dp {0, 0.1}, 2 feeders per cell, both families.
# Validity and runtime only.
exp_id: iter08_quick
out_dir: results/iter08_change_detection/quick
workers: 2
threads: 4
watchdog: true
watchdog_grace_s: 60
families:
  physics: {timeout_s: 1800}
  tabpfn: {models: [E1, E4], group: tabpfn, max_concurrent: 2, timeout_s: 1800}
arms:
  - {name: change, config: configs/iter08_change.yaml, runner: "paperb.change_eval:run_seed", seeds: [0], families: [physics, tabpfn],
     set: ["change.N=[20]", "change.p1=[0.05,0.1]", "change.dp=[0.0,0.1]", "change.feeders_per_cell=2"]}
