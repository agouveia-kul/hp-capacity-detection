# Iteration 08 probe: the run's (configs/iter08.yaml) seed-0 jobs, same job ids and out_dir; the run skips them.
# Logs runtime and validity counts only (no detection or error metric before the report script is committed).
exp_id: iter08
out_dir: results/iter08_change_detection
workers: 2
threads: 4
watchdog: true
watchdog_grace_s: 60
families:
  physics: {timeout_s: 7200}
  tabpfn: {models: [E1, E4], group: tabpfn, max_concurrent: 2, timeout_s: 7200}
arms:
  - {name: change, config: configs/iter08_change.yaml, runner: "paperb.change_eval:run_seed", seeds: [0], families: [physics, tabpfn]}
