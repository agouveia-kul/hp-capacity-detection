# 05a Task 6 timing probe: GB-EoH 2021/22, seed 0, the full v1.1 grid, the 05b candidate grid (feature sets {netfit, both}
# x anchors {size, size_peak} x {direct-log, residual}), one queue job per family (FFNN at the full budget).
base: configs/pool_gb_eoh_2122.yaml
exp_id: iter05a_timing
out_dir: results/iter05a_pool/overnight/timing_probe
