  k: 4
  inner_substations_per_cell: 5
  early_stopping: next_training_fold
  hyperopt:
    max_evals: 10
    seed: split_seed
  final_refit: median_best_iteration
models:
- Lasso
- XGBoost
ffnn:
  enabled: false
feature_sets:
- netfit
modes:
- direct
- residual
target_transforms:
- none
residual_models:
- Lasso
paperA:
  estimators:
  - paperA_sh_mh
  - paperA_cal
  - paperA_corr
  cap_def: hp_peak
  min_station_pilot: 10
  target: HP_Peak
  cap_def_check: false
  fill_station: null
  crossfit: true
anchors:
- size
model_anchors: {}
anchor_only_baselines:
  models:
  - Linear
  features:
  - - size
physics_baselines:
- slope_base
features:
  T_base: 12.0
  kwargs:
    resolution: 15
    mild_thresh: 10.0
    cold_thresh: 25.0
    weekday_only: true
    include_shape: false
    include_minmax: true
    include_quantiles: true
    include_n_days: false
    include_corr_features: false
    include_climate_context: false
    normalize_by_peak: true
targets:
- HP_Peak
target_defs:
  robust_q: 0.999
  T_design_C: -3.0
bootstrap:
  unit: hp_household
  B: 2000
  seed: split_seed
uncertainty:
  bootstrap: false
  summary_band:
  - 0.05
  - 0.9
parallel:
  workers: 1
  blas_threads: 1
  cores: 28
  threads: 28
metrics:
- wape
- mape
- r2
- rmse
- mae
quick:
  split.seeds:
  - 0
  grid.size:
  - 10
  grid.substations_per_cell:
    train: 6
    test: 3
  cv.inner_substations_per_cell: 3
  cv.hyperopt.max_evals: 5
  models:
  - XGBoost
  anchors:
  - size_peak
  targets:
  - HP_Peak
  physics_baselines:
  - slope_only
  anchor_only_baselines.models:
  - Linear
  bootstrap.B: 200
