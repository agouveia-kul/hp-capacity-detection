exp_id: iter05_quick
protocol: v1.1
out_dir: results/iter05a_pool
cache_dir: data/_paperb
paper_a_repo: ../hp-sensitivity-paper
pool:
  option: gb_eoh
  year: 2122r2
  coverage_min: 0.9
  station_alias:
    8jB: KLO
  sfh_own_load_type: Single-family house
  seed: 0
  windows:
    first: '2021-06-01'
    last_start: '2022-01-01'
  data_end: '2023-09-29'
  zero_run_heat_tol_kW: 0.1
  max_interp_slots: 4
  holidays: GB-ENG
  fill:
    calendar: GB-ENG
    lcl_window:
    - '2012-07-01'
    - '2014-02-28'
    lcl_coverage_min: 0.9
    lcl_max_kwh: 10.0
    lcl_zero_run_slots: 48
    max_interp_slots: 4
