    - 30
    - 45
    - 60
    tol_K: 1.0
    k_nearest: 3
    temp_source: heathrow
    subset: null
split:
  test_frac: 0.25
  stratify: station
  seeds:
  - 0
grid:
  size:
  - 10
  - 40
  penetration:
  - 0.1
  - 0.5
  n_hp: round
  max_overlap: 0.75
  min_station_pool: 3
  substations_per_cell:
    train: 10
    test: 5
  on_infeasible: drop
cv:
